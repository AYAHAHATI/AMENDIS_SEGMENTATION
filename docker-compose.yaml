---
x-airflow-common:
  &airflow-common

  build: .

  environment:
    &airflow-common-env
    PYTHONPATH: /opt/airflow

    AIRFLOW__CORE__EXECUTOR: CeleryExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow

    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres/airflow

    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    AIRFLOW__CORE__FERNET_KEY: ''

    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'

    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'

    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    # Délais plus longs : sur une machine lente (Docker Desktop sous
    # Windows), le serveur web dépasse les 120 s par défaut et redémarre
    # en boucle ("No response from gunicorn master within 120 seconds").
    AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: '600'
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '600'

    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-}

  volumes:

    # DAGs Airflow
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags

    # Pipeline ETL
    - ${AIRFLOW_PROJ_DIR:-.}/pipeline:/opt/airflow/pipeline

    # Données
    - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data

    # Machine Learning
    - ${AIRFLOW_PROJ_DIR:-.}/ml:/opt/airflow/ml

    # Modèles ML
    - ${AIRFLOW_PROJ_DIR:-.}/models:/opt/airflow/models

    # Logs
    - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs

    # Configuration
    - ${AIRFLOW_PROJ_DIR:-.}/config:/opt/airflow/config

    # Plugins
    - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    &airflow-common-depends-on

    redis:
      condition: service_healthy

    postgres:
      condition: service_healthy


services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:

    image: postgres:13

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s

    restart: always


  # ==========================================================
  # REDIS
  # ==========================================================

  redis:

    image: redis:7.2-bookworm

    expose:
      - 6379

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

    restart: always


  # ==========================================================
  # AIRFLOW WEBSERVER
  # ==========================================================

  airflow-webserver:

    <<: *airflow-common

    # Un seul worker Gunicorn pour réduire
    # la consommation de ressources sur le PC local
    command: webserver --workers 1

    ports:
      - "8080:8080"

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8080/health"
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ==========================================================
  # AIRFLOW SCHEDULER
  # ==========================================================

  airflow-scheduler:

    <<: *airflow-common

    command: scheduler

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:8974/health"
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ==========================================================
  # AIRFLOW WORKER
  # ==========================================================

  airflow-worker:

    <<: *airflow-common

    command: celery worker

    healthcheck:

      test:
        - "CMD-SHELL"

        - 'celery --app airflow.providers.celery.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}" || celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:

      <<: *airflow-common-env

      DUMB_INIT_SETSID: "0"

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ==========================================================
  # AIRFLOW TRIGGERER
  # ==========================================================

  airflow-triggerer:

    <<: *airflow-common

    command: triggerer

    healthcheck:

      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type TriggererJob --hostname \"$${HOSTNAME}\""
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


  # ==========================================================
  # AIRFLOW INIT
  # ==========================================================

  airflow-init:

    <<: *airflow-common

    entrypoint: /bin/bash

    command:

      - -c

      - |

        if [[ -z "${AIRFLOW_UID}" ]]; then

          echo
          echo -e "\033[1;33mWARNING!!!: AIRFLOW_UID not set!\e[0m"

          echo "If you are on Linux, you SHOULD follow the instructions below to set AIRFLOW_UID."

          echo

        fi

        one_meg=1048576

        mem_available=$$(($$(getconf _PHYS_PAGES) * $$(getconf PAGE_SIZE) / one_meg))

        cpus_available=$$(grep -cE 'cpu[0-9]+' /proc/stat)

        disk_available=$$(df / | tail -1 | awk '{print $$4}')

        warning_resources="false"

        if (( mem_available < 4000 )); then

          echo
          echo -e "\033[1;33mWARNING!!!: Not enough memory available for Docker.\e[0m"
          echo

          warning_resources="true"

        fi

        if (( cpus_available < 2 )); then

          echo
          echo -e "\033[1;33mWARNING!!!: Not enough CPUS available for Docker.\e[0m"
          echo

          warning_resources="true"

        fi

        if (( disk_available < one_meg * 10 )); then

          echo
          echo -e "\033[1;33mWARNING!!!: Not enough Disk space available for Docker.\e[0m"
          echo

          warning_resources="true"

        fi

        if [[ $${warning_resources} == "true" ]]; then

          echo
          echo -e "\033[1;33mWARNING!!!: You have not enough resources to run Airflow.\e[0m"
          echo

        fi

        mkdir -p /sources/logs /sources/dags /sources/plugins

        chown -R "${AIRFLOW_UID}:0" /sources/{logs,dags,plugins}

        exec /entrypoint airflow version


    environment:

      <<: *airflow-common-env

      _AIRFLOW_DB_MIGRATE: 'true'

      _AIRFLOW_WWW_USER_CREATE: 'true'

      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}

      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}

      _PIP_ADDITIONAL_REQUIREMENTS: ''


    user: "0:0"

    volumes:

      - ${AIRFLOW_PROJ_DIR:-.}:/sources

      - ${AIRFLOW_PROJ_DIR:-.}/pipeline:/opt/airflow/pipeline

      - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data

      - ${AIRFLOW_PROJ_DIR:-.}/ml:/opt/airflow/ml

      - ${AIRFLOW_PROJ_DIR:-.}/models:/opt/airflow/models


  # ==========================================================
  # AIRFLOW CLI
  # ==========================================================

  airflow-cli:

    <<: *airflow-common

    profiles:
      - debug

    environment:

      <<: *airflow-common-env

      CONNECTION_CHECK_MAX_COUNT: "0"

    command:

      - bash

      - -c

      - airflow


  # ==========================================================
  # FLOWER
  # ==========================================================

  flower:

    <<: *airflow-common

    command: celery flower

    profiles:
      - flower

    ports:
      - "5555:5555"

    healthcheck:

      test:
        [
          "CMD",
          "curl",
          "--fail",
          "http://localhost:5555/"
        ]

      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    restart: always

    depends_on:
      <<: *airflow-common-depends-on

      airflow-init:
        condition: service_completed_successfully


# ==========================================================
# VOLUMES
# ==========================================================

volumes:

  postgres-db-volume: